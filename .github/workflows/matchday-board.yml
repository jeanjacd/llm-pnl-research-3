name: matchday-board

# PAPER TRADING ONLY. There is deliberately no job, step or credential here
# capable of placing a real order: the venue providers are read-only and the
# broker writes to its own ledger.

on:
  schedule:
    # Every 2h, every day (UTC). The cadence sets how late a deferred fixture
    # can be retried while still being GUARANTEED to happen at all: the retry
    # deadline is min_hours + 2 x interval + slack, so a looser cadence forces
    # the retry earlier.
    #
    #   cadence   deadline   retry lead (min/median/max)   missed
    #      6h       15h        8.4h / 12.1h / 15.0h          0
    #      2h        7h        4.4h /  6.0h /  7.0h          0
    #
    # At 6h a deferral was retried a median of 12.1h out -- barely better
    # informed than the original pass at 24h, which is the whole point of a
    # retry. 2h lands it at 6.0h.
    #
    # Affordable because discovery is now filtered to the fixtures a run could
    # act on, so a run with nothing in its window costs ~40s across five
    # leagues instead of ~21 minutes. 77% of runs board nothing at all.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      leagues:
        description: "Comma-separated league ids (blank = all)"
        required: false
        default: ""

permissions:
  # WRITE, not read: both workflows persist the paper ledger by pushing to the
  # `automation-state` branch, and `contents: read` made every scheduled run
  # fail at its LAST step with
  #   Permission to ... denied to github-actions[bot] ... 403
  # after doing all of the work -- including spending a board call. The
  # repository default is already `write`; this block was what restricted it.
  contents: write

# One writer at a time: overlapping runs must never mutate the same portfolio.
concurrency:
  group: paper-portfolio
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    # Sized from the real fixture calendar, not a guess. Simulating the
    # 6-hourly schedule over three weeks: the mean run boards 2.2 fixtures
    # (~12 min of model time) but the busiest boards 16 -- a Friday, when the
    # whole Saturday card across five leagues crosses T-24h in one 6h band.
    # At the measured 330s per fixture (quant 87s + coach 180s + judge) that
    # is 88 minutes, plus ~21 minutes of discovery for five leagues.
    #
    # 45 minutes killed 8 of 84 simulated runs mid-flight, losing the whole
    # run's work. 180 leaves headroom over the ~110-minute worst case and
    # still finishes well inside the 6h gap to the next run, so the
    # concurrency queue never backs up.
    # Sized from the fixture calendar at THIS cadence: the busiest run boards
    # 11 fixtures (60 min of model time at the measured 330s each), plus
    # discovery. Must also stay under the 2h gap to the next run, or the
    # concurrency queue backs up run on run -- both bounds are asserted.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e ".[dev]"

      # Durable state lives on a dedicated branch, NOT in a dependency cache.
      - name: Restore paper state
        run: python scripts/state_sync.py restore --branch automation-state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `data/leagues/*/raw/` is gitignored -- the match CSVs are NOT in the
      # repo, only the fitted params are. Without this step a runner has no
      # fixtures and no training data, so every league is skipped and the
      # whole cycle is a silent no-op. (Found 2026-08-25; the workflow had
      # never had a data step.)
      - name: Fetch match data
        run: python -m wc2026 update --all

      - name: Run one paper cycle
        env:
          # Two supported auth routes -- set ONE of these as a repo secret:
          #   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token`, billed to
          #                            your Claude subscription. Expires
          #                            eventually; the board fails CLOSED
          #                            (defers everything) when it does, so
          #                            check the run summary periodically.
          #   ANTHROPIC_API_KEY        metered API credits, does not expire.
          # Whichever is unset is simply empty; the CLI picks the one present.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WC2026_PAPER_ONLY: "1"
        run: |
          python -m wc2026 paper-cycle \
            --leagues "${{ github.event.inputs.leagues }}" \
            --state data/paper/portfolio.json \
            --summary run_summary.md

      - name: Persist paper state
        run: python scripts/state_sync.py save --branch automation-state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sanitised summary only. Full prompts/responses and raw authenticated
      # payloads never enter the public log.
      - name: Publish sanitised summary
        run: cat run_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload detailed artifacts (private to the repo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-cycle-${{ github.run_id }}
          path: |
            data/paper/
            data/snapshots/
          retention-days: 30
