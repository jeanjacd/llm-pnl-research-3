name: hourly-board

# PAPER TRADING ONLY. There is deliberately no job, step or credential here
# capable of placing a real order: the venue providers are read-only and the
# broker writes to its own ledger.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      leagues:
        description: "Comma-separated league ids (blank = all)"
        required: false
        default: ""

permissions:
  contents: read

# One writer at a time: overlapping runs must never mutate the same portfolio.
concurrency:
  group: paper-portfolio
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e ".[dev]"

      # Durable state lives on a dedicated branch, NOT in a dependency cache.
      - name: Restore paper state
        run: python scripts/state_sync.py restore --branch automation-state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run one paper cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WC2026_PAPER_ONLY: "1"
        run: |
          python -m wc2026 paper-cycle \
            --leagues "${{ github.event.inputs.leagues }}" \
            --state data/paper/portfolio.json \
            --summary run_summary.md

      - name: Persist paper state
        run: python scripts/state_sync.py save --branch automation-state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sanitised summary only. Full prompts/responses and raw authenticated
      # payloads never enter the public log.
      - name: Publish sanitised summary
        run: cat run_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload detailed artifacts (private to the repo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-cycle-${{ github.run_id }}
          path: |
            data/paper/
            data/snapshots/
          retention-days: 30
