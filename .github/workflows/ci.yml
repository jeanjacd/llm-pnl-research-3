name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install from project metadata
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check wc2026 tests
      - name: Import smoke test
        run: python -c "import wc2026, wc2026.leagues, wc2026.venues, wc2026.decision, wc2026.board, wc2026.paper; print('imports ok')"
      - name: CLI smoke test
        run: python -m wc2026 leagues
      - name: Tests with coverage
        env:
          # Offline: no test may reach a venue or a model.
          WC2026_OFFLINE: "1"
        run: pytest -q --cov=wc2026 --cov-report=term-missing --cov-fail-under=70
      - name: Verify no private state is committed
        run: python scripts/check_no_private_state.py
