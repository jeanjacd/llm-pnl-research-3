[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wc2026"
version = "2.0.0"
description = "Multi-league soccer market research and paper-trading system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "requests>=2.31",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyyaml>=6.0",
]

[project.scripts]
wc2026 = "wc2026.cli:main"

[tool.setuptools.packages.find]
include = ["wc2026*"]
exclude = ["legacy*", "archive*", "tests*", "scripts*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["wc2026"]
omit = ["wc2026/sim/tournament.py"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["legacy", "archive", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # long lines are checked by review, not by the linter
    "E741",   # ambiguous names are avoided by convention
]

[tool.ruff.lint.per-file-ignores]
# Test code favours compact fixtures over prose style: one-line setup
# (`args = Args(); args.live = True`), small lambdas as stubs, and locals
# kept for readability in assertions.
"tests/*" = ["E402", "E702", "E731", "F841"]
"scripts/*" = ["E402"]
